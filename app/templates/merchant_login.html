{% extends "base.html" %}
{% block title %}Merchant login — ZeroDevicePay{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>🏪 Merchant login</h1>
  <p class="muted">Sign in to collect payments from customers by account ID.</p>
  <form method="post" class="form">
    <label>Merchant username
      <input name="username" value="{{ form.username or '' }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">Customer instead? <a href="{{ url_for('main.login') }}">Customer login</a>.</p>
</section>
{% endblock %}
